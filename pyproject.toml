[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h5scene"
version = "0.1.0"
description = "Per-scene HDF5 writers + file handles (H5Base / H5Cam / H5CamRig) with the unified (T, N, H, W) layout; the rig file is references only (ExternalLinks + VDS)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "h5py>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest"]
imgtest = ["scikit-image>=0.26,<0.27", "pillow>=13,<14"]

[tool.setuptools.packages.find]
include = ["h5scene*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
h5scene = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
imgtest = { features = ["imgtest"], solve-group = "default" }

[tool.pixi.tasks]
test = "python -m pytest tests/ -q"
smoke-img = "pixi run -e imgtest python tests/smoke_image_formats.py"

[tool.pixi.dependencies]
